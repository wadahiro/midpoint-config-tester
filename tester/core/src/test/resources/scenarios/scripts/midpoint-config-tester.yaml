# The HR sample (scenarios/hr) with an LDAP resource that has an additional SSH connector and provisioning scripts
# (ScriptsScenarioTest), both resources on the mirror connector: the additional connector goes, the mirror accepts the
# scripts.
config:
  dirs: [../hr/post-initial-objects, post-initial-objects]
  exclude: [resources/021-resource-ldap.xml]
  schema: ../../schema
  properties:
    ldapBase: dc=example,dc=com
    mailDomain: example.com
  overlays:
    "4.0": { dirs: [../hr/overlays/4.0] }
    "4.8": { dirs: [../hr/overlays/4.8] }
targets:
  HR:   { connector: mirror, namingAttribute: empno }
  LDAP: { connector: mirror, namingAttribute: dn, referentialIntegrity: true }
mail: { redirect: true }

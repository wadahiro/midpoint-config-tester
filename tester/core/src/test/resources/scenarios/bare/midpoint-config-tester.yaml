# A deployment of nothing: midPoint as it starts, for the tests of the tester's own mechanisms that import their
# configuration in the test (resources with different options, fixtures of one test). The reset after each test
# empties and forgets what a test imported.
config:
  dirs: [objects]
  overlays:
    # 4.11: the system configuration of a deployment that scripts in Groovy, as upgraded (../groovy-4.11)
    "4.11": { dirs: [../groovy-4.11] }

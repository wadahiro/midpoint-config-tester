# A function library whose script holds a constant, and a role whose focus mapping calls it: a test changes the
# constant for itself (ConfigScenarioTest, t.config()), the next test runs the library as deployed.
config:
  dirs: [objects]
  overlays:
    # 4.11: the system configuration of a deployment that scripts in Groovy, as upgraded (../groovy-4.11)
    "4.11": { dirs: [../groovy-4.11] }

# A deployment of nothing whose mapped directory starts with a tree (InitialFilesScenarioTest): a file to read and an
# empty directory to write in (kept in git by a .gitkeep), as a deployment's volume has them.
config:
  dirs: [../bare/objects]
  overlays:
    # 4.11: the system configuration of a deployment that scripts in Groovy, as upgraded (../groovy-4.11)
    "4.11": { dirs: [../groovy-4.11] }
files:
  initial: { /opt/data: files/opt-data }

name: Release

# Every push to main: the tests of all lines, then semantic-release. From the Conventional Commits since the last tag it
# takes the next version (none for only build:, docs:, chore: and the like), sets it in every module, deploys it
# (README, Publishing), commits the versions, the next snapshot and CHANGELOG.md, tags the release and makes a GitHub
# release. The deployment goes to the Maven repository on the branch mvn-repo, or to Maven Central while the
# repository variable RELEASE_TO_CENTRAL is true.
on:
  push:
    branches: [main]

concurrency: release

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: ./.github/workflows/ci.yml
    with:
      all-lines: true

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      # every mvn call of the release (versions:set as well as deploy) takes these: Maven 3.9 reads MAVEN_ARGS. All
      # lines, and where the deployment goes: Central (the profile release), or the checkout of the branch mvn-repo.
      # (maven-semantic-release takes only "deploy" as its target and adds -DskipTests itself.)
      MAVEN_ARGS: >-
        -Pnon-lts
        ${{ vars.RELEASE_TO_CENTRAL == 'true'
        && '-Prelease -DautoPublish=true -DwaitUntil=published'
        || format('-DaltDeploymentRepository=mvn-repo::file://{0}/_mvn-repo', github.workspace) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        if: vars.RELEASE_TO_CENTRAL != 'true'
        with:
          ref: mvn-repo
          path: _mvn-repo
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # JDK 11 for the toolchain of 4.0 and 4.4; the last one runs Maven
          java-version: |
            11
            21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ vars.RELEASE_TO_CENTRAL == 'true' && secrets.GPG_PRIVATE_KEY || '' }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @terrestris/maven-semantic-release@2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Push the release to the branch mvn-repo
        if: vars.RELEASE_TO_CENTRAL != 'true' && steps.semantic.outputs.new_release_published == 'true'
        working-directory: _mvn-repo
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: release ${{ steps.semantic.outputs.new_release_version }}"
          git push origin HEAD:mvn-repo

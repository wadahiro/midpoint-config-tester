name: CI

on:
  push:
    # main is tested by the release workflow, which calls this one
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    # One job per midPoint line, on the JDK midPoint recommends for it (its release notes): the line module (the shared
    # tests on a real midPoint with an in-memory PostgreSQL, pgmem), its static checks and the examples on it, with the
    # modules they need (-am). Maven runs on that JDK, and so do the tests. Every line, the ones after 4.8 too
    # (-Pnon-lts, which adds their modules): the jobs run side by side.
    name: test (${{ matrix.line }}, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      # every line's result, not only the first failure
      fail-fast: false
      matrix:
        include:
          - line: '4.0'
            java: 11
            modules: tester/midpoint-4.0,tester/static/midpoint-4.0,examples/kotest-scenarios/midpoint-4.0
            # the Kotest layer compiles against the 4.8 tester (JDK 17+): the modules are installed on JDK 21 first,
            # then tested on JDK 11 from the local repository, as a config repository uses the tester
            installed: true
          - line: '4.4'
            java: 17
            modules: tester/midpoint-4.4,tester/static/midpoint-4.4
          - line: '4.8'
            java: 21
            modules: tester/midpoint-4.8,tester/static/midpoint-4.8,tester/kotest,examples/hr-ldap,examples/kotest-scenarios/midpoint-4.8
          - line: '4.9'
            java: 21
            modules: tester/midpoint-4.9,tester/static/midpoint-4.9
          - line: '4.10'
            java: 21
            modules: tester/midpoint-4.10,tester/static/midpoint-4.10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # the last one runs Maven (JAVA_HOME); JDK 21 also builds what a JDK 11 line installs first
          java-version: |
            21
            ${{ matrix.java }}
      # the Maven repository, one cache per line: setup-java's cache has one key for all the jobs, which run side by
      # side, so only the first to finish saved it, with its own line's dependencies alone. The key changes with the
      # POMs, which every release changes (the versions), so a miss restores the latest one of the line instead of
      # downloading everything
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ matrix.line }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ matrix.line }}-
      - if: matrix.installed
        run: mvn -B install -DskipTests -Pnon-lts -pl ${{ matrix.modules }} -am
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      - run: mvn -B test -Pnon-lts -pl ${{ matrix.modules }} ${{ !matrix.installed && '-am' || '' }}
      # what the jobs build is not a dependency to keep: the next run builds it again
      - if: always()
        run: rm -rf ~/.m2/repository/io/github/wadahiro/midpoint
